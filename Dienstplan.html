<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-title" content="helmut-körnig-halle-sportanlagen/Dienstplan">
<title>helmut-körnig-halle-sportanlagen/Dienstplan</title>
<link rel="icon" type="image/png" href="./bilder/favicon.png">
<link rel="apple-touch-icon" href="./bilder/symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDEA; --panel:#F7F9F7; --ink:#000; --ink-2:#000; --line:#C3CCC6;
  --accent:#17694B; --on-accent:#FFFFFF; --fehler:#B3261E;
  --wochenende:#DDE3DF; --ich:#E3F2EA; --fokus:#FFF7D6;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F1512; --panel:#18211C; --ink:#E7EEE9; --ink-2:#9BAAA1; --line:#33413A;
  --accent:#4CC38A; --on-accent:#06150E; --fehler:#F2766B;
  --wochenende:#222D27; --ich:#1D3529; --fokus:#2C3A22;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:calc(16px + var(--schrift-plus,0px)); line-height:1.4}
.wrap{max-width:1400px; margin:0 auto; padding:0 16px 40px}
.kopf{display:flex; align-items:center; gap:12px; padding-top:24px}
.hkh-kopf{display:inline-flex; align-items:center; gap:10px; min-width:0; flex:none; text-decoration:none; color:inherit; border-radius:6px}
.hkh-kopf img{flex:none; display:block; height:34px; width:auto}
.hkh-marke{display:flex; flex-direction:column; gap:2px; margin:0; font-family:var(--body); font-size:calc(13px + var(--schrift-plus,0px)); font-weight:500; line-height:1.15; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-2)}
h1{margin:22px 0 4px; font-family:var(--display); font-weight:600; font-size:calc(clamp(32px, 8vw, 44px) + var(--schrift-plus,0px)); line-height:1}
.muted{margin:0; font-size:calc(15px + var(--schrift-plus,0px)); color:var(--ink-2)}
.knopf{font:inherit; font-size:calc(15px + var(--schrift-plus,0px)); font-weight:600; min-height:42px; padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; gap:8px; text-decoration:none}
.knopf.primaer{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.knopf.klein{min-height:34px; padding:4px 12px; font-size:calc(14px + var(--schrift-plus,0px))}
.knopf:disabled{opacity:.5; cursor:not-allowed}
.knopf svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
button:focus-visible, a:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.leiste{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:16px 0 12px}
.titelzeile{display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; margin:22px 0 14px}
.titelzeile h1{margin:0}
@media (max-width:560px){
  .titelzeile{flex-wrap:nowrap; gap:10px; justify-content:space-between}
  .titelzeile h1{font-size:calc(28px + var(--schrift-plus,0px)); min-width:0}
  .titelzeile .monat{flex:none; gap:0; padding:2px}
  .titelzeile .monat button{width:34px; height:34px; font-size:calc(20px + var(--schrift-plus,0px))}
  .titelzeile .monat strong{min-width:0; font-size:calc(17px + var(--schrift-plus,0px)); padding:0 2px; white-space:nowrap}
}
.monat{display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px}
.monat button{width:38px; height:38px; border-radius:50%; border:0; background:none; color:var(--ink); font-size:calc(22px + var(--schrift-plus,0px)); line-height:1; cursor:pointer}
.monat button:hover{background:color-mix(in srgb, var(--ink) 8%, transparent)}
.monat strong{min-width:160px; text-align:center; font-family:var(--display); font-weight:600; font-size:calc(22px + var(--schrift-plus,0px))}
.schalter{display:inline-flex; border:1px solid var(--line); border-radius:999px; background:var(--panel); padding:3px}
.schalter button{border:0; background:none; font:inherit; font-size:calc(14px + var(--schrift-plus,0px)); font-weight:600; padding:7px 14px; border-radius:999px; color:var(--ink-2); cursor:pointer}
.schalter button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}
.zoom{display:inline-flex; align-items:center; gap:2px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px}
.zoom button{width:36px; height:36px; border-radius:50%; border:0; background:none; color:var(--ink); font-size:calc(22px + var(--schrift-plus,0px)); line-height:1; cursor:pointer}
.zoom button:hover{background:color-mix(in srgb, var(--ink) 8%, transparent)}
.zoom output{min-width:52px; text-align:center; font-size:calc(14px + var(--schrift-plus,0px)); font-weight:600; font-variant-numeric:tabular-nums; cursor:pointer}
.rahmen{touch-action:pan-x pan-y}
.hinweis{font-size:calc(14px + var(--schrift-plus,0px)); color:var(--ink-2); margin:0 0 10px}
.leer{background:var(--panel); border:1px dashed var(--line); border-radius:14px; padding:24px; display:flex; flex-direction:column; gap:12px; align-items:flex-start}

/* Die Tabelle wie der Papierplan: alle Zeilen gleich hoch */
.rahmen{background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:auto; -webkit-overflow-scrolling:touch}
/* Zeilen im gleichen Verhältnis wie auf dem Papierplan: Zeilenhöhe etwa 1,7 x Schriftgröße */
table.plan{border-collapse:separate; border-spacing:0; width:100%; min-width:1380px; font-size:calc(15px + var(--schrift-plus,0px)); font-variant-numeric:tabular-nums}
.plan th,.plan td{border:0; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:0 6px; text-align:center; white-space:nowrap; height:26px; line-height:25px; overflow:hidden; text-overflow:ellipsis}
.plan thead th{background:var(--panel); font-weight:600}
.plan thead tr:nth-child(2) th{font-weight:500; color:var(--ink-2); font-size:calc(13px + var(--schrift-plus,0px))}
.plan .nr{width:38px; min-width:38px; text-align:right; color:var(--ink-2)}
.plan .tag{text-align:left; width:108px; min-width:108px}
/* Datum und Wochentag bleiben beim Wischen stehen und decken den Rest ab */
.plan th.nr,.plan td.nr{position:sticky; left:0; z-index:2; background:var(--panel); }
.plan th.tag,.plan td.tag{position:sticky; left:38px; z-index:2; background:var(--panel); box-shadow:inset -1px 0 0 var(--line), 3px 0 6px -3px rgba(0,0,0,.25)}
.plan tbody tr.we td.nr,.plan tbody tr.we td.tag{background:var(--wochenende)}
.bearbeiten .plan th.nr,.bearbeiten .plan td.nr{left:30px}
.bearbeiten .plan th.tag,.bearbeiten .plan td.tag{left:68px}
.plan tbody tr{background:var(--panel)}
.plan tbody tr.we{background:var(--wochenende)}
.plan tbody tr.heute td.nr,.plan tbody tr.heute td.tag{font-weight:700; color:var(--accent)}
.plan .kz{width:58px; min-width:58px}
.plan td.kz.kurz{font-weight:700}
.plan td.kz.ftg{font-weight:700; letter-spacing:.02em}
.plan input.feld::placeholder{color:var(--ink-2); opacity:.8; font-weight:700}
.plan .zeit{width:112px; min-width:112px; max-width:112px}
/* Spalten mit "von / bis" (wie bei Pap): beide Hälften gleich breit, wie auf dem Papier */
.plan .vb{width:64px; min-width:64px; max-width:64px}
/* Veranstaltung nimmt den restlichen Platz; zu lange Texte enden mit … (im Druck vollständig) */
.plan .ver{width:100%; max-width:1px}
/* Zu lange Veranstaltung: antippen zeigt den ganzen Text, noch einmal antippen klappt ihn wieder zu */
.plan td.ver.offen{white-space:normal; overflow:visible; line-height:1.3; height:auto; padding:4px 6px}
@media (max-width:899px){ .plan td.ver{text-align:left} }
.plan th.ich,.plan td.ich{background:var(--ich)}
.plan tr.we td.ich{background:color-mix(in srgb, var(--ich) 55%, var(--wochenende))}
.plan th.ich{color:var(--accent)}
.plan th.kopf-feld{min-width:170px}
.stand{text-align:right; font-size:calc(13px + var(--schrift-plus,0px)); color:var(--ink-2); margin:6px 4px 0}

/* Bearbeiten wie in Excel: jedes Feld ist direkt beschreibbar */
.plan input.feld{width:100%; height:25px; border:0; border-radius:0; padding:0 4px; margin:0; background:transparent; text-align:center; font:inherit; color:var(--ink); outline:none}
.plan input.feld:focus{background:var(--fokus); box-shadow:inset 0 0 0 2px var(--accent)}
.plan td:has(> input.feld),.plan th:has(> input.feld){padding:0}
.plan input.feld.links{text-align:left}
.plan td.nr input.feld{text-align:right}
.plan input.feld.kurz{font-weight:700}
.plan thead input.feld{font-weight:600}
.kopf-zelle{display:flex; align-items:center}
.kopf-zelle input{flex:1 1 auto}
.x-knopf{flex:none; width:28px; height:28px; border:0; background:none; color:var(--ink-2); cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:6px; margin:auto}
.x-knopf:hover{background:color-mix(in srgb, #B3261E 14%, transparent); color:#B3261E}
.x-knopf svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round}
.plan .weg-sp{width:30px; min-width:30px; padding:0; background:var(--panel); position:sticky; left:0; z-index:2}
.plan tbody tr.we td.weg-sp{background:var(--wochenende)}
.plan th.neu-spalte{vertical-align:top; padding:6px; background:var(--panel); border-style:dashed; width:110px; height:auto}
.plan tfoot td{height:auto; padding:8px; text-align:left; background:var(--panel); border-bottom:0; position:static}
.grau-wahl{font-size:calc(14px + var(--schrift-plus,0px)); color:var(--ink-2); margin-left:10px; display:inline-flex; gap:6px; align-items:center}

/* Speichern-Leiste wie bei den Sportanlagen */
.speicher-leiste{position:fixed; z-index:58; left:max(12px, env(safe-area-inset-left)); right:max(12px, env(safe-area-inset-right)); bottom:calc(max(12px, env(safe-area-inset-bottom)) + var(--hkh-leiste-h, 62px)); max-width:640px; margin:0 auto; display:flex; align-items:center; gap:10px; padding:8px 8px 8px 16px; border-radius:16px; border:1px solid var(--accent); background:var(--panel); box-shadow:0 6px 24px rgba(20,32,27,.22)}
.speicher-text{flex:1 1 auto; min-width:0; font-size:calc(14px + var(--schrift-plus,0px)); font-weight:600; color:var(--ink)}
.speicher-text.fehler{color:var(--fehler)}
body.mit-speichern{padding-bottom:calc(var(--hkh-leiste-h, 62px) + 90px + env(safe-area-inset-bottom))}

.druckkopf{display:none; justify-content:space-between; align-items:baseline; margin:0 0 4px}
html.tablett h1, html.tablett #unter, html.tablett #hinweis, html.tablett #drucken, html.tablett .zoom, html.tablett .kopf{display:none !important}
html.tablett .wrap{max-width:none; padding:0 12px 12px}
html.tablett .leiste{margin:8px 0 6px}
html.tablett .druckkopf{display:flex; align-items:center; margin:8px 0 8px}
html.tablett #druck-monat{display:none}
html.tablett .leiste{display:none !important}
html.tablett .titelzeile{display:none !important}
html.tablett .druckkopf .monat strong{font-family:var(--body); font-weight:500; font-size:calc(28px + var(--schrift-plus,0px)); text-transform:none; min-width:0; padding:0 6px}
html.tablett .druckkopf .monat{padding:2px}
html.tablett .rahmen{overflow:hidden}
html.tablett table.plan{min-width:0}
.druckkopf b{font-size:calc(28px + var(--schrift-plus,0px)); font-weight:500}

/* Drucken: A4 quer, sieht aus wie der Aushang */
@media print{
  @page{size:A4 landscape; margin:8mm}
  :root,:root[data-theme="dark"]{--panel:#FFFFFF; --bg:#FFFFFF; --ink:#000; --ink-2:#000; --line:#000; --wochenende:#D6D6D6; --ich:#FFFFFF; --accent:#000}
  body{background:#FFF; font-size:calc(11px + var(--schrift-plus,0px))}
  /* Wochenenden und Feiertage auch im Druck grau: Hintergründe immer mitdrucken */
  *{-webkit-print-color-adjust:exact !important; print-color-adjust:exact !important}
  .nicht-drucken,.titelzeile,.kopf,.leiste,.hinweis,h1,.muted,.weg-sp,tfoot,.neu-spalte,.speicher-leiste,.hkh-leiste,.leer{display:none !important}
  body.mit-speichern,body.hkh-mit-leiste{padding:0 !important}
  .wrap{max-width:none; padding:0}
  .druckkopf{display:flex !important}
  .rahmen{border:0; border-radius:0; overflow:visible}
  table.plan{min-width:0; font-size:calc(10.5px + var(--schrift-plus,0px)); border:2px solid #000}
  .plan th,.plan td{height:19.5px; line-height:18.5px; padding:0 4px; border-color:#000}
  .plan tr > :last-child{border-right:0}
  .plan tbody tr:last-child > *{border-bottom:0}
  .plan th.nr,.plan td.nr,.plan th.tag,.plan td.tag{position:static; box-shadow:none}
  table.plan{zoom:1 !important}
  .plan .ver{min-width:0; max-width:none; width:auto}
  .plan .zeit{width:86px; min-width:86px; max-width:86px}
  .plan .vb{width:46px; min-width:46px; max-width:46px}
  /* Auf dem Tablet sitzen die Monatspfeile im Kopf: im Druck nur der Monat als Überschrift */
  .druckkopf .monat{display:none !important}
  #druck-monat{display:inline !important}
  .plan thead tr:nth-child(2) th{font-size:inherit}
  .plan tbody tr.heute td.nr,.plan tbody tr.heute td.tag,.plan th.ich{color:#000; font-weight:inherit}
  .stand{color:#000}
  tr{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap" id="seite">

<header class="kopf">
  <a class="logo-link hkh-kopf" href="./" aria-label="Zur Startseite">
    <img src="./bilder/logo.png" alt="Dortmunder Sportstätten" width="480" height="241">
    <span class="hkh-marke"><span>Helmut-Körnig-Halle</span><span>Personal</span></span>
  </a>
</header>

<p class="muted" id="pruefung" style="margin-top:48px">Einen Moment …</p>

<section id="kein-zugang" hidden>
  <h1>Dienstplan</h1>
  <p class="muted" id="kein-zugang-text" style="margin-top:12px">Bitte zuerst anmelden: Auf der Startseite den Hell/Dunkel-Knopf gedrückt halten und den Zugangscode eingeben.</p>
  <p style="margin-top:16px"><a class="knopf" href="./">Zur Startseite</a></p>
</section>

<section id="panel" hidden>
  <div class="titelzeile">
    <h1>Dienstplan</h1>
    <div class="monat nicht-drucken"><button type="button" id="monat-zurueck" aria-label="Vormonat" title="Vormonat">‹</button><strong id="monat-name">–</strong><button type="button" id="monat-vor" aria-label="Nächster Monat" title="Nächster Monat">›</button></div>
  </div>
  <p class="muted" id="unter" hidden></p>
  <p class="hinweis" id="hinweis" hidden></p>

  <div class="druckkopf"><b id="druck-titel">Dienstplan HKH</b><b id="druck-monat"></b></div>
  <div class="leer" id="leer" hidden>
    <p class="muted" id="leer-text">Für diesen Monat gibt es noch keinen Dienstplan.</p>
    <button class="knopf primaer" type="button" id="anlegen" hidden>Dienstplan für diesen Monat anlegen</button>
  </div>

  <div id="plan-bereich" hidden>
    <div class="rahmen" id="rahmen"><table class="plan" id="plan"></table></div>
    <p class="stand" id="stand"></p>
  </div>

  <!-- Ansehen/Bearbeiten, Tabellengröße und Drucken unter der Tabelle -->
  <div class="leiste nicht-drucken">
    <div class="schalter" id="modus" role="group" aria-label="Ansicht" hidden>
      <button type="button" data-modus="ansehen" aria-pressed="true">Ansehen</button>
      <button type="button" data-modus="bearbeiten" aria-pressed="false">Bearbeiten</button>
    </div>
    <div class="zoom" role="group" aria-label="Tabelle vergrößern oder verkleinern"><button type="button" id="zoom-aus" aria-label="Verkleinern" title="Verkleinern">−</button><output id="zoom-wert" title="Zurück auf 100 %">100 %</output><button type="button" id="zoom-ein" aria-label="Vergrößern" title="Vergrößern">+</button></div>
    <button class="knopf primaer" type="button" id="drucken"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 17h2a2 2 0 0 0 2 -2v-4a2 2 0 0 0 -2 -2h-14a2 2 0 0 0 -2 2v4a2 2 0 0 0 2 2h2" /><path d="M17 9v-4a2 2 0 0 0 -2 -2h-6a2 2 0 0 0 -2 2v4" /><path d="M7 15a2 2 0 0 1 2 -2h6a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-6a2 2 0 0 1 -2 -2l0 -4" /></svg>Drucken / PDF</button>
  </div>
</section>
</div>

<div class="speicher-leiste" id="speicher-leiste" role="region" aria-label="Nicht gespeicherte Änderungen" hidden>
  <span class="speicher-text" id="speicher-text" aria-live="polite">Nicht gespeichert</span>
  <button class="knopf" id="speicher-verwerfen" type="button">Verwerfen</button>
  <button class="knopf primaer" id="speicher-knopf" type="button">Speichern</button>
</div>

<script type="module">
import { db, ref, get, set, onValue, sitzung, darf, darfZusatz, istRechteFehler } from "./js/zugang.js";
import { leisteStarten } from "./js/leiste.js";

const $ = (id) => document.getElementById(id);
const esc = (x) => String(x ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

/* Farbschema wie überall. Umgeschaltet wird in der Personal-Leiste. */
const wurzel = document.documentElement;
let gemerkt = null;
try { gemerkt = localStorage.getItem("hkh-thema"); } catch (e) {}
wurzel.dataset.theme = (gemerkt ? gemerkt === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";

const TAGE = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const X_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6l-12 12" /><path d="M6 6l12 12" /></svg>`;
const BERLIN = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Berlin" });
const heuteKey = () => BERLIN.format(new Date());   // "2026-11-23"

let ICH = null, DARF_BEARBEITEN = false;
let MONAT = heuteKey().slice(0, 7);                 // "2026-11"
let PLAN = null;           // was gerade angezeigt bzw. bearbeitet wird
let GESPEICHERT = null;    // letzter Stand aus der Datenbank (Text)
let BEARBEITEN = false, GEAENDERT = false;
let stopp = null;

const monatName = (m) => { const [j, mo] = m.split("-").map(Number); return `${MONATE[mo - 1]} ${j}`; };
const monatPlus = (m, d) => { const [j, mo] = m.split("-").map(Number); const x = new Date(j, mo - 1 + d, 1); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}`; };
const tageIm = (m) => { const [j, mo] = m.split("-").map(Number); return new Date(j, mo, 0).getDate(); };
const datumText = () => { const [j, m, t] = heuteKey().split("-"); return `${t}.${m}.${j}`; };

/* ---- Feiertage in NRW ---- */
function ostersonntag(j) {
  const a = j % 19, b = Math.floor(j / 100), c = j % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  return new Date(j, Math.floor((h + l - 7 * m + 114) / 31) - 1, ((h + l - 7 * m + 114) % 31) + 1);
}
const FEIERTAGE = {};
function feiertage(j) {
  if (FEIERTAGE[j]) return FEIERTAGE[j];
  const liste = {}, k = (d) => `${d.getMonth() + 1}-${d.getDate()}`;
  const ostern = ostersonntag(j), plus = (n) => new Date(j, ostern.getMonth(), ostern.getDate() + n);
  [["1-1", "Neujahr"], ["5-1", "Tag der Arbeit"], ["10-3", "Tag der Deutschen Einheit"], ["11-1", "Allerheiligen"], ["12-25", "1. Weihnachtstag"], ["12-26", "2. Weihnachtstag"]].forEach(([d, n]) => { liste[d] = n; });
  [[-2, "Karfreitag"], [1, "Ostermontag"], [39, "Christi Himmelfahrt"], [50, "Pfingstmontag"], [60, "Fronleichnam"]].forEach(([n, name]) => { liste[k(plus(n))] = name; });
  return (FEIERTAGE[j] = liste);
}
/* Feiertag zu einer Zeile des angezeigten Monats ("1." -> Allerheiligen im November) */
function feiertagVon(m, nr) {
  const t = parseInt(String(nr), 10);
  if (!t || !/^\s*\d{1,2}\.?\s*$/.test(String(nr))) return "";
  const [j, mo] = m.split("-").map(Number);

const leereZeile = (n, grau = false, nr = "", tag = "") => ({ nr, tag, grau, z: Array.from({ length: n }, () => ["", ""]), ver: "" });
function tagesZeilen(m, n) {
  const [j, mo] = m.split("-").map(Number);
  const zeilen = [];
  for (let t = 1; t <= tageIm(m); t++) {
    const wt = new Date(j, mo - 1, t).getDay();
    const ft = feiertage(j)[`${mo}-${t}`] ?? "";
    const z = leereZeile(n, wt === 0 || wt === 6 || !!ft, t + ".", TAGE[wt]);
    z.ver = ft;   // der Name des Feiertags steht schon bei Veranstaltung und kann überschrieben werden
    zeilen.push(z);
  }
  zeilen.push(leereZeile(n));   // unten eine leere Zeile wie auf dem Papier
  return zeilen;
}

function lesen(roh) {
  let p = null;
  try { p = JSON.parse(roh); } catch (e) { return null; }
  if (!p || !Array.isArray(p.spalten) || !Array.isArray(p.zeilen)) return null;
  const t = (x, max = 300) => (typeof x === "string" ? x.slice(0, max) : "");
  const spalten = p.spalten.slice(0, 40).map((s) => ({ name: t(s?.name, 80), a: t(s?.a, 30), b: t(s?.b, 30) }));
  const zeilen = p.zeilen.slice(0, 80).map((r) => ({
    nr: t(r?.nr, 10), tag: t(r?.tag, 30), grau: r?.grau === true, ver: t(r?.ver, 300),
    z: spalten.map((_, i) => [t(r?.z?.[i]?.[0], 40), t(r?.z?.[i]?.[1], 40)]),

const uhr = (t) => { const z = t.replace(/[^0-9]/g, ""); if (!z) return ""; const s = z.length <= 2 ? z.padStart(2, "0") + "00" : z.padStart(4, "0").slice(0, 4); return String(Math.min(23, +s.slice(0, 2))).padStart(2, "0") + ":" + String(Math.min(59, +s.slice(2))).padStart(2, "0"); };
const istZeit = (t) => /^\s*\d{1,2}([:.]?\d{2})?\s*(-|–|bis)\s*\d{1,2}([:.]?\d{2})?\s*$/.test(t) || /^\s*\d{1,2}[:.]\d{2}\s*$/.test(t);
const plan = $("plan");
/* Ein Schichtkürzel (z. B. F oder M) in einer F/M-Spalte gilt gleich für die ganze Woche:
   Montag bis Freitag derselben Woche, ohne Wochenenden und Feiertage. Überschrieben werden
   nur leere Felder und andere Kürzel, keine längeren Einträge. */
function wocheFuellen(ri, sp, wert) {
  if (!PLAN || !/^[A-Za-zÄÖÜäöü]{1,2}$/.test(wert)) return;
  if (!/F\s*\/\s*M/i.test(PLAN.spalten[sp]?.a ?? "")) return;
  const tagVon = (r) => { const m = /^\s*(\d{1,2})\.?\s*$/.exec(r?.nr ?? ""); return m ? +m[1] : 0; };
  const t = tagVon(PLAN.zeilen[ri]);
  if (!t) return;
  const [j, mo] = MONAT.split("-").map(Number);
  const montag = t - ((new Date(j, mo - 1, t).getDay() + 6) % 7);
  let geaendertHier = false;
  PLAN.zeilen.forEach((r, i) => {
    const tg = tagVon(r);
    if (i === ri || !tg || tg < montag || tg > montag + 4 || r.grau || feiertagVon(MONAT, r.nr)) return;
    const alt = (r.z[sp]?.[0] ?? "").trim();
    if (alt && !/^[A-Za-zÄÖÜäöü]{1,2}$/.test(alt)) return;
    if (alt === wert) return;
    r.z[sp][0] = wert;
    geaendertHier = true;
    const feld = plan.querySelector(`[data-z="${i}"][data-sp="${sp}"][data-teil="0"]`);
    if (feld) { feld.value = wert; feld.classList.add("kurz"); }
  });
  if (geaendertHier && !GEAENDERT) geaendert();
}

    const neu = f.value.split(/\s*(?:-|–|bis)\s*/).map(uhr).join("-");
    if (neu !== f.value) { f.value = neu; if (!GEAENDERT) geaendert(); }
  }
  if (d.k) PLAN.kopf[d.k] = f.value;
  else if (d.z !== undefined && d.sp !== undefined) PLAN.zeilen[+d.z].z[+d.sp][+d.teil] = f.value;
  else if (d.z !== undefined) PLAN.zeilen[+d.z][d.teil] = f.value;

  if (d.teil === "0") f.classList.toggle("kurz", f.value.trim().length <= 2);

let ZOOM = 1;
try { ZOOM = Number(localStorage.getItem("hkh-dienstplan-zoom")) || 1; } catch (e) {}
function zoomSetzen(z, merken = true) {
  ZOOM = Math.min(2, Math.max(0.4, Math.round(z * 100) / 100));
  plan.style.zoom = String(ZOOM);
  $("zoom-wert").textContent = `${Math.round(ZOOM * 100)} %`;
  $("zoom-aus").disabled = ZOOM <= 0.4; $("zoom-ein").disabled = ZOOM >= 2;
  if (merken) try { localStorage.setItem("hkh-dienstplan-zoom", String(ZOOM)); } catch (e) {}
}
if (!window.HKH_TABLETT) zoomSetzen(ZOOM, false);
$("zoom-aus").addEventListener("click", () => zoomSetzen(ZOOM - 0.1));
$("zoom-ein").addEventListener("click", () => zoomSetzen(ZOOM + 0.1));
$("zoom-wert").addEventListener("click", () => zoomSetzen(1));
const rahmen = $("rahmen");
rahmen.addEventListener("wheel", (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  zoomSetzen(ZOOM * (e.deltaY < 0 ? 1.08 : 1 / 1.08));
}, { passive: false });
let finger = null;
const abstand = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
rahmen.addEventListener("touchstart", (e) => { if (e.touches.length === 2) finger = { d: abstand(e.touches), z: ZOOM }; }, { passive: true });
rahmen.addEventListener("touchmove", (e) => {
  if (!finger || e.touches.length !== 2) return;
  e.preventDefault();
  zoomSetzen(finger.z * abstand(e.touches) / finger.d, false);
}, { passive: false });
rahmen.addEventListener("touchend", (e) => { if (finger && e.touches.length < 2) { finger = null; zoomSetzen(ZOOM); } });

/* ---- Start ---- */
(async () => {
  let s = null;
  try { s = await sitzung(); } catch (err) { console.error(err); }
  $("pruefung").hidden = true;
  if (!s || !darf(s, "dienstplan")) {
    $("kein-zugang").hidden = false;
    if (s) $("kein-zugang-text").textContent = "Dieser Zugang darf den Dienstplan nicht sehen. Ein Admin kann das im Admin Panel freischalten.";
    if (s) leisteStarten(s, "dienstplan");
    return;
  }
  ICH = s;
  DARF_BEARBEITEN = darfZusatz(s, "dienstplan", "bearbeiten");
  leisteStarten(s, "dienstplan");
  $("modus").hidden = !DARF_BEARBEITEN;
  $("unter").textContent = `Angemeldet als ${s.name}. Steht dein Name oben in der Tabelle, ist deine Spalte grün hinterlegt.`;
  $("panel").hidden = false;
  hinweisZeigen();
  /* Tablet: die Monatstaste steht rechts im Kopf, genau da, wo sonst der Monat steht */
  if (window.HKH_TABLETT) document.querySelector(".druckkopf").appendChild(document.querySelector(".monat"));
  monatLaden();
})();
</script>
