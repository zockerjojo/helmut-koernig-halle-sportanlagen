name: Nächtliche Sicherung

# Zweimal, damit es Sommer wie Winter nahe Mitternacht nach Berliner Zeit liegt.
# Das Skript legt pro Tag höchstens eine Sicherung an, der zweite Lauf tut dann nichts.
on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  sichern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sicherung erstellen
        env:
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
        run: node .github/scripts/sicherung.mjs
