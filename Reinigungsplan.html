<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-title" content="helmut-körnig-halle-sportanlagen/Reinigungsplan">
<title>helmut-körnig-halle-sportanlagen/Reinigungsplan</title>
<link rel="icon" type="image/png" href="./bilder/favicon.png">
<link rel="apple-touch-icon" href="./bilder/symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: Ein-Bildschirm-Werkzeug. Hochkant: Kopf, Bedienung, Plan, Fuss. Quer: Bedienung links, Plan rechts. */
  --bg:#E9EDEA;
  --panel:#F7F9F7;
  --ink:#000;
  --ink-2:#000;
  --line:#C3CCC6;
  --accent:#17694B;
  --on-accent:#FFFFFF;
  --danger:#B3261E; --ungewischt:#A8B2AC;
  --plan-track:#DCE3DE;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1512;--panel:#18211C;--ink:#E7EEE9;--ink-2:#9BAAA1;--line:#33413A;
    --accent:#4CC38A;--on-accent:#06150E;--danger:#F2766B;--plan-track:#212D27;--ungewischt:#C3CCC6;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1512;--panel:#18211C;--ink:#E7EEE9;--ink-2:#9BAAA1;--line:#33413A;
  --accent:#4CC38A;--on-accent:#06150E;--danger:#F2766B;--plan-track:#212D27;--ungewischt:#C3CCC6;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:calc(16px + var(--schrift-plus,0px));overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"top" "ctl" "map" "bot"}
.top{grid-area:top;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 16px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo-link{display:flex;align-items:center;flex:none;border-radius:6px}
.logo-link:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.logo{display:block;height:34px;width:auto;flex:none}
.top{align-items:center !important}
.top h1{font-family:var(--font-display);font-weight:600;font-size:calc(26px + var(--schrift-plus,0px));line-height:1;margin:0;letter-spacing:.01em}
#prog{font-size:calc(15px + var(--schrift-plus,0px));font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.ctl{grid-area:ctl;display:flex;flex-direction:column;gap:8px;padding:4px 16px 10px}
.row{display:flex;gap:8px;align-items:center}
.row .lbl{font-size:calc(13px + var(--schrift-plus,0px));color:var(--ink-2);flex:none;width:52px}
.seg{display:flex;flex:1;gap:6px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
.b{flex:1;min-width:0;min-height:44px;padding:6px 8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:calc(15px + var(--schrift-plus,0px));font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.b:focus-visible,.zb:focus-visible,.ghost:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#people{flex-wrap:wrap}
#people .b{flex:1 1 40%}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.two{display:grid;grid-template-columns:3fr 2fr;gap:8px}
.two .seg .b{font-size:calc(14px + var(--schrift-plus,0px));padding:6px 4px}
.mini{font-size:calc(12px + var(--schrift-plus,0px));color:var(--ink-2);margin:0 0 3px}
.map{grid-area:map;position:relative;min-height:0;min-width:0;margin:0 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.map.color{background:var(--panel)}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zb{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:calc(22px + var(--schrift-plus,0px));font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center}
.zb.txt{font-size:calc(12px + var(--schrift-plus,0px))}
.bot{grid-area:bot;display:flex;flex-direction:column;gap:8px;padding:8px 16px 12px}
#info{font-size:calc(15px + var(--schrift-plus,0px));line-height:1.3;min-height:40px;margin:0;color:var(--ink-2);display:flex;align-items:center}
#info.strong{color:var(--ink);font-weight:500}
.ghost{flex:1 1 150px;min-width:150px;min-height:44px;border:1px solid var(--line);background:transparent;border-radius:10px;font-size:calc(15px + var(--schrift-plus,0px));font-weight:500}
.ghost.danger{color:var(--danger)}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.shade.open{display:flex}
.shade.gate{background:var(--bg);align-items:center;padding:16px}
.shade.gate .sheet{max-height:none;width:100%;max-width:460px;border:1px solid var(--line);border-radius:16px}
.sheet{width:100%;max-width:520px;max-height:80%;overflow:auto;background:var(--panel);border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-bottom:0}
.sheet h2{font-family:var(--font-display);font-size:calc(22px + var(--schrift-plus,0px));font-weight:600;margin:0;text-wrap:balance}
.sheet p{margin:0;font-size:calc(15px + var(--schrift-plus,0px));line-height:1.4;color:var(--ink-2)}
textarea,.tf{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:88px;resize:vertical;-webkit-user-select:text;user-select:text}
.tf{min-height:48px;resize:none}
textarea:focus-visible,.tf:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
#code-err{-webkit-user-select:text;user-select:text;overflow-wrap:anywhere}
.err{color:var(--danger);font-size:calc(14px + var(--schrift-plus,0px));min-height:18px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.primary{flex:1;min-height:44px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:calc(15px + var(--schrift-plus,0px));font-weight:600}
.primary.danger{background:var(--danger);color:#fff}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px}
.note.hot{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.num{width:26px;height:26px;border-radius:50%;background:#F29F05;color:#2B1B00;font-weight:600;font-size:calc(14px + var(--schrift-plus,0px));display:flex;align-items:center;justify-content:center;flex:none}
.note .tx{flex:1;min-width:0;font-size:calc(15px + var(--schrift-plus,0px));line-height:1.35;overflow-wrap:anywhere;color:var(--ink)}
.note .meta{display:block;font-size:calc(13px + var(--schrift-plus,0px));color:var(--ink-2);margin-top:2px}
.note button{flex:none;min-height:36px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--danger);font-size:calc(14px + var(--schrift-plus,0px))}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none}
.live{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 0;margin:0;border:0;background:none;font-size:calc(13px + var(--schrift-plus,0px));font-weight:500;color:var(--ink-2);white-space:nowrap}
.live .ld{width:10px;height:10px;border-radius:50%;background:#8A968F;flex:none}
.live.s-live .ld{background:#2DBE6C;box-shadow:0 0 0 3px rgba(45,190,108,.28)}
.live.s-connecting .ld,.live.s-offline .ld{background:#F2A900}
.live.s-denied .ld,.live.s-fail .ld,.live.s-nocode .ld{background:var(--danger)}
.live:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.chk{display:flex;gap:10px;align-items:center;font-size:calc(15px + var(--schrift-plus,0px));min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}

/* Plan-Ansicht */
.hall{fill:var(--panel);stroke:none}
.floor{fill:none}
.track{fill:var(--plan-track)}
.sand,.mat{fill:none}
.trib{fill:var(--line)}
.ln{fill:none;stroke:var(--ink-2);stroke-width:.9}
.ln.thin{stroke-width:.45}
.ln.dash{stroke-dasharray:3 2}
.hallwall{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.gate{display:none}
.color .gate{display:inline;fill:#FFFFFF;stroke:#10201A;stroke-width:.5;stroke-linejoin:round}
.wall{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.fence{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:5 2.2;stroke-linejoin:round}
.zgate{fill:none;stroke:var(--ink);stroke-width:1.2}
.wpan{fill:var(--ink);stroke:var(--ink);stroke-width:.6;stroke-linejoin:round}
.color .wpan{fill:#FFFFFF;stroke:#10201A}
.pil{fill:var(--panel);stroke:var(--ink);stroke-width:1.1}
.color .pil{fill:#DAD7CC;stroke:#10201A}
.color .zgate{stroke:#10201A}
.tag{font-family:var(--font-body);font-size:8.5px;fill:var(--ink-2);text-anchor:middle}
#paint path{stroke-opacity:.62}
/* Noch nicht gewischte Bahnen: nur sichtbar, solange die Anzeige eingeschaltet ist.
   Hellgrau; auf hellem Untergrund etwas kraeftiger, damit es nicht verschwindet. */
.nichtgereinigt{stroke:var(--ungewischt);stroke-opacity:.95}
.map.nuroffen #free{display:none}
.color .nichtgereinigt{stroke:#D7DCD8}
/* Farb-Ansicht */
.color .hall{fill:#4E9977}
.color .floor{fill:#57A683}
.color .track{fill:#B4513E}
.color .sand{fill:#DCC48E}
.color .mat{fill:#E7B21C}
.color .trib{fill:#8C9590}
.color .ln{stroke:#FFFFFF;stroke-opacity:.9}
.color .tag{fill:#FFFFFF}
.color .wall,.color .fence,.color .hallwall{stroke:#10201A}
.color #paint path{stroke-opacity:.82}
#free path{stroke-opacity:.9}
.color #free path{stroke-opacity:.9}
.map:not(.color) #paint path,.map:not(.color) #free path{stroke-opacity:.82}
/* Offene Bahnen moeglichst deckend, sonst mischt sich das Grau mit der Farbe darunter. */
.map:not(.color) #paint path.nichtgereinigt,.map:not(.color) #free path.nichtgereinigt{stroke-opacity:.95}
.color #paint path.nichtgereinigt,.color #free path.nichtgereinigt{stroke-opacity:1}
.map:not(.color) #pins circle{fill:var(--panel) !important;stroke:var(--ink) !important}
.map:not(.color) #pins text{fill:var(--ink) !important}
.zb:disabled{opacity:.35}

@media (orientation:landscape) and (max-height:540px){
  #app{grid-template-columns:300px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top map" "ctl map" "bot map"}
  .ctl{overflow:auto;padding-bottom:4px}
  .row .lbl{width:38px}
  .b{font-size:calc(14px + var(--schrift-plus,0px));padding:4px 6px}
  .seg{flex-wrap:wrap}
  .seg .b{flex:1 1 40%}
  .seg .b.sym,.seg .breite{flex:1 1 15%}
  .two{grid-template-columns:1fr}
  .two .seg .b{flex:1 1 28%}
  .map{margin:10px 16px 10px 0}
  .top h1{font-size:calc(22px + var(--schrift-plus,0px))}
  #info{min-height:32px;font-size:calc(14px + var(--schrift-plus,0px))}
  .bot{padding-top:4px}
}
/* kompakte Bedienung */
.top{padding:6px 12px 2px}
.top h1{font-size:calc(16px + var(--schrift-plus,0px));white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.thb{flex:none;width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--panel);font-size:calc(16px + var(--schrift-plus,0px));line-height:1;display:flex;align-items:center;justify-content:center;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
/* Knopf mit Wort darin: rechteckig mit runden Ecken, wie die übrigen Knöpfe */
.thb.weit{width:auto;height:auto;min-height:30px;padding:4px 12px;border-radius:10px;font-size:calc(13px + var(--schrift-plus,0px));font-weight:500}
.logo{height:28px}
#prog{font-size:calc(13px + var(--schrift-plus,0px))}
.ctl{gap:6px;padding:4px 12px 6px}
.b{min-height:34px;padding:4px 6px;font-size:calc(14px + var(--schrift-plus,0px))}
.ghost{min-height:36px;font-size:calc(14px + var(--schrift-plus,0px))}
.r1{display:flex;gap:6px;align-items:center}
.r3{display:flex;gap:6px;align-items:center;justify-content:space-between}
.switch .opt svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mehr{position:relative;flex:none}
.mehr > .b{width:56px;min-height:36px;position:relative}
.mehr-zahl{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:calc(11px + var(--schrift-plus,0px));font-weight:700;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;pointer-events:none}
.mehr-zahl[hidden]{display:none}
#mehr-knopf:has(.mehr-zahl:not([hidden])) svg{transform:translateX(-7px)}
.mmenu{position:absolute;top:calc(100% + 4px);right:0;z-index:20;display:none;flex-direction:column;gap:4px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.18);width:min(300px,86vw)}
.mmenu.open{display:flex}
.mmenu .ghost{flex:none;width:100%;min-width:0;text-align:left;padding:0 12px}
/* Werkzeuge als Symbole; das Wort steht am PC beim Drüberfahren (title) */
.b.sym svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.breite{position:relative;flex:1;display:flex;min-width:0}
.breite > .b{flex:1}
.bmenu{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);z-index:20;display:none;flex-direction:column;gap:4px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.18);min-width:120px}
.bmenu.open{display:flex}
.bmenu .b{flex:none;min-height:40px}
.bmenu .linie{width:72px;height:20px;fill:none;stroke:currentColor;stroke-linecap:round}
.r3 .seg .b{font-size:calc(13px + var(--schrift-plus,0px))}
.seg.sm .b{padding:4px 4px}
.who{position:relative;flex:none}
.wbtn{min-width:98px;justify-content:space-between;gap:6px;flex:none}
.wbtn .car{font-size:calc(11px + var(--schrift-plus,0px));color:var(--ink-2)}
.wmenu{position:absolute;top:calc(100% + 4px);left:0;z-index:20;display:none;flex-direction:column;gap:4px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.wmenu.open{display:flex}
.wmenu .b{justify-content:flex-start;flex:none;min-height:38px;font-size:calc(15px + var(--schrift-plus,0px))}
.switch{position:relative;display:flex;align-items:stretch;width:84px;height:34px;flex:none;padding:0;border:1px solid var(--line);border-radius:17px;background:var(--panel);overflow:hidden}
.switch .knob{position:absolute;top:0;left:0;width:50%;height:100%;border-radius:17px;background:var(--accent);transition:transform .15s}
.switch[data-d="right"] .knob,.switch[data-d="color"] .knob{transform:translateX(100%)}
.switch.full{width:100%}
.switch[data-d="plan"] .o1,.switch[data-d="color"] .o2{color:var(--on-accent)}
.switch.full .opt{font-size:calc(14px + var(--schrift-plus,0px))}
.sl3{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;height:34px;border:1px solid var(--line);border-radius:17px;background:var(--panel);overflow:hidden;min-width:0}
.sl3 .knob3{position:absolute;top:0;left:0;width:33.3334%;height:100%;border-radius:17px;background:var(--accent);transition:transform .15s}
.sl3[data-pos="1"] .knob3{transform:translateX(100%)}
.sl3.two{grid-template-columns:1fr 1fr;flex:1}
.sl3.two .knob3{width:50%}
.sl3.two .sl-opt{font-size:calc(14px + var(--schrift-plus,0px))}
.sl3[data-pos="2"] .knob3{transform:translateX(200%)}
.sl-opt{position:relative;z-index:1;min-width:0;border:0;background:none;font-size:calc(13px + var(--schrift-plus,0px));font-weight:500;color:var(--ink);padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-opt[aria-pressed="true"]{color:var(--on-accent);font-weight:600}
.switch .opt{position:relative;flex:1;display:flex;align-items:center;justify-content:center;font-size:calc(17px + var(--schrift-plus,0px));font-weight:600;color:var(--ink);z-index:1}
.switch[data-d="down"] .o1,.switch[data-d="right"] .o2{color:var(--on-accent)}
.zoom{gap:5px}
.map.zrow .zoom{flex-direction:row;left:8px;justify-content:space-between}
.zb{width:38px;height:38px;font-size:calc(18px + var(--schrift-plus,0px))}
.zb.txt{font-size:calc(12px + var(--schrift-plus,0px))}
.zb:disabled{opacity:.35}
.fullmap .top,.fullmap .bot{display:none !important}
.fullmap #app{grid-template-columns:minmax(0,1fr) !important;grid-template-rows:auto minmax(0,1fr) !important;grid-template-areas:"ctl" "map" !important}
.fullmap .map{margin:0 !important;border:0 !important;border-radius:0 !important}
@media (prefers-reduced-motion:no-preference){.b,.zb{transition:background-color .12s}}
/* Knopf zurück zur Startseite im Anmeldefenster */
a.ghost{display:flex;align-items:center;justify-content:center;gap:2px;color:var(--ink);text-decoration:none}
/* Augen-Taste: blendet den eingegebenen Code ein und aus */
.feld-eingabe{position:relative;display:flex}
.feld-eingabe .tf{padding-right:52px}
.augen-knopf{position:absolute;top:0;right:0;bottom:0;width:48px;display:flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:0 10px 10px 0;background:none;color:var(--ink);opacity:.65;cursor:pointer}
.augen-knopf:hover{opacity:1}
.augen-knopf:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.augen-knopf svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.augen-knopf .auge-zu{display:none}
.augen-knopf[aria-pressed="true"] .auge-auf{display:none}
.augen-knopf[aria-pressed="true"] .auge-zu{display:block}
/* Einheitlicher Kopf auf allen Personalseiten: Logo, darunter-/daneben "Helmut-Körnig-Halle" und "Personal" wie auf der Startseite */
.hkh-kopf{display:inline-flex !important; align-items:center; gap:10px; min-width:0; flex:none; text-decoration:none; color:inherit; border-radius:6px}
.hkh-kopf img{flex:none; display:block; height:34px !important; width:auto}
.hkh-marke{display:flex; flex-direction:column; gap:2px; margin:0; font-family:Barlow, system-ui, -apple-system, "Segoe UI", sans-serif; font-size:calc(13px + var(--schrift-plus,0px)); font-weight:500; line-height:1.15; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-2)}
#app .top{align-items:flex-start !important}
#app .top .brand{flex-direction:column; align-items:flex-start; gap:8px}
#app .top h1{font-size:calc(clamp(32px, 8vw, 44px) + var(--schrift-plus,0px)); white-space:normal; flex:none; overflow:visible}
@media (max-height:520px){ #app .top h1{font-size:calc(22px + var(--schrift-plus,0px))} #app .top .brand{flex-direction:row; align-items:center; gap:12px} }
/* Die Knöpfe zum Zoomen und Drehen liegen in einer Leiste unter dem Plan, nicht mehr darauf */
#svg{top:0 !important;bottom:auto !important;height:calc(100% - 54px) !important}
.zoom,.map.zrow .zoom{position:absolute;left:0 !important;right:0;bottom:0;top:auto;height:54px;flex-direction:row !important;justify-content:flex-end !important;align-items:center;gap:6px;padding:0 8px;border-top:1px solid var(--line);background:var(--panel)}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><a class="logo-link hkh-kopf" href="./" aria-label="Zur Startseite"><img src="./bilder/logo.png" alt="Dortmunder Sportstätten" width="480" height="241"><span class="hkh-marke"><span>Helmut-Körnig-Halle</span><span>Personal</span></span></a><h1>Reinigungsplan</h1></div>
    <div class="hr"><span id="prog" aria-live="polite"></span><button class="live s-none" id="live" type="button" aria-label="Live-Abgleich und Zugangscode"><span class="ld"></span><span id="live-t">Nur dieses Gerät</span></button></div>
  </header>

  <section class="ctl" aria-label="Bedienung">
    <div class="r1">
      <div class="who">
        <button class="b wbtn" id="who-btn" type="button" title="Für wen wird eingetragen?"><span class="dot" id="who-dot"></span><span id="who-name">…</span><span class="car" id="who-car" aria-hidden="true" hidden>&#9662;</span></button>
        <div class="wmenu" id="people" role="menu" aria-label="Für wen wird eingetragen?"></div>
      </div>
      <div class="sl3 two" id="art-sl" data-pos="0" role="group" aria-label="Art: Bahnen oder Frei">
        <span class="knob3" aria-hidden="true"></span>
        <button type="button" class="sl-opt" id="a-lanes" data-k="art" data-v="lanes">Bahnen</button>
        <button type="button" class="sl-opt" id="a-free" data-k="art" data-v="free">Frei</button>
      </div>
      <button class="switch" id="dir-sw" type="button" data-d="down" aria-label="Richtung: oben nach unten oder links nach rechts" title="Richtung">
        <span class="knob" aria-hidden="true"></span><span class="opt o1" aria-hidden="true">&darr;</span><span class="opt o2" aria-hidden="true">&rarr;</span>
      </button>
    </div>
    <div class="seg" role="group" aria-label="Werkzeug">
      <button class="b sym" id="m-paint" data-k="mode" data-v="paint" title="Malen" aria-label="Malen"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 21v-4a4 4 0 1 1 4 4h-4" /> <path d="M21 3a16 16 0 0 0 -12.8 10.2" /> <path d="M21 3a16 16 0 0 1 -10.2 12.8" /> <path d="M10.6 9a9 9 0 0 1 4.4 4.4" /></svg></button>
      <button class="b sym" id="m-erase" data-k="mode" data-v="erase" title="Radieren" aria-label="Radieren"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 20h-10.5l-4.21 -4.3a1 1 0 0 1 0 -1.41l10 -10a1 1 0 0 1 1.41 0l5 5a1 1 0 0 1 0 1.41l-9.2 9.3" /> <path d="M18 13.3l-6.3 -6.3" /></svg></button>
      <div class="breite">
        <button class="b sym" id="b-knopf" type="button" title="Strichbreite" aria-label="Strichbreite: Breit" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g transform="translate(3.2 0) scale(.78)"><path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4" /> <path d="M13.5 6.5l4 4" /></g><line id="b-strich" x1="3" y1="21.6" x2="21" y2="21.6" stroke-width="3.2"/></svg></button>
        <div class="bmenu" id="b-menu" role="menu" aria-label="Strichbreite">
          <button type="button" class="b" id="b-all" data-k="brush" data-v="all" role="menuitemradio" title="Breit" aria-label="Breit"><svg class="linie" viewBox="0 0 72 20" aria-hidden="true" focusable="false"><line x1="6" y1="10" x2="66" y2="10" stroke-width="9"/></svg></button>
          <button type="button" class="b" id="b-mid" data-k="brush" data-v="mid" role="menuitemradio" title="Mittel" aria-label="Mittel"><svg class="linie" viewBox="0 0 72 20" aria-hidden="true" focusable="false"><line x1="6" y1="10" x2="66" y2="10" stroke-width="5"/></svg></button>
          <button type="button" class="b" id="b-one" data-k="brush" data-v="one" role="menuitemradio" title="Schmal" aria-label="Schmal"><svg class="linie" viewBox="0 0 72 20" aria-hidden="true" focusable="false"><line x1="6" y1="10" x2="66" y2="10" stroke-width="2"/></svg></button>
        </div>
      </div>
      <button class="b sym" id="m-note" data-k="mode" data-v="note" title="Notiz" aria-label="Notiz"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 9h8" /> <path d="M8 13h6" /> <path d="M9 18h-3a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-3l-3 3l-3 -3" /></svg></button>
      <button class="b sym" id="m-move" data-k="mode" data-v="move" title="Schieben" aria-label="Schieben"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 11v-3.5a1.5 1.5 0 0 1 3 0v2.5" /> <path d="M11 9.5v-3a1.5 1.5 0 0 1 3 0v3.5" /> <path d="M14 7.5a1.5 1.5 0 0 1 3 0v2.5" /> <path d="M17 9.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7l-.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47" /></svg></button>
    </div>
    <div class="r3">
      <button class="switch" id="view-sw" type="button" data-d="plan" aria-label="Ansicht: Plan oder Farbe" title="Ansicht: Plan oder Farbe">
        <span class="knob" aria-hidden="true"></span><span class="opt o1" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7l6 -3l6 3l6 -3v13l-6 3l-6 -3l-6 3v-13" /> <path d="M9 4v13" /> <path d="M15 7v13" /></svg></span><span class="opt o2" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21a9 9 0 0 1 0 -18c4.97 0 9 3.582 9 8c0 1.06 -.474 2.078 -1.318 2.828c-.844 .75 -1.989 1.172 -3.182 1.172h-2.5a2 2 0 0 0 -1 3.75a1.3 1.3 0 0 1 -1 2.25" /> <path d="M7.5 10.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /> <path d="M11.5 7.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /> <path d="M15.5 10.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /></svg></span>
      </button>
      <div class="mehr">
        <button class="b sym" id="mehr-knopf" type="button" title="Mehr: Notizen, Umschalten, Herunterladen, Zurücksetzen" aria-label="Mehr: Notizen, Umschalten, Herunterladen, Zurücksetzen" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6l16 0" /> <path d="M4 12l16 0" /> <path d="M4 18l16 0" /></svg><span class="mehr-zahl" id="mehr-zahl" hidden></span></button>
        <div class="mmenu" id="mehr-menu" role="menu" aria-label="Mehr">
          <button class="ghost" id="open-notes" role="menuitem">Notizen (0)</button>
          <button class="ghost" id="btn-offen" type="button" role="menuitemcheckbox" aria-pressed="false">Umschalten nicht gereinigte Bereiche</button>
          <button class="ghost" id="btn-bild" type="button" role="menuitem">Plan herunterladen</button>
          <button class="ghost danger" id="open-reset" role="menuitem">Zurücksetzen</button>
        </div>
      </div>
    </div>
  </section>

    <p id="info" aria-live="polite"></p>

  <div class="shade" id="sh-edit">
    <div class="sheet" role="dialog" aria-labelledby="h-edit">
      <h2 id="h-edit">Neue Notiz</h2>
      <p id="edit-who"></p>
      <textarea id="note-text" placeholder="Hier Information eingeben" maxlength="200"></textarea>
      <div class="err" id="note-err"></div>
      <div class="acts">
        <button class="ghost" id="edit-cancel">Abbrechen</button>
        <button class="primary" id="edit-save">Notiz speichern</button>
      </div>
    </div>
  </div>

  <div class="shade" id="sh-note1">
    <div class="sheet" role="dialog" aria-labelledby="h-note1">
      <h2 id="h-note1">Notiz</h2>
      <p id="note1-text" style="margin:0;color:var(--ink);font-size:calc(17px + var(--schrift-plus,0px));line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere"></p>
      <p id="note1-meta" style="margin:0;font-size:calc(14px + var(--schrift-plus,0px));color:var(--ink-2)"></p>
      <div class="acts">
        <button class="ghost" id="note1-alle" type="button">Alle Notizen</button>
        <button class="primary" id="note1-zu" type="button">Schließen</button>
      </div>
    </div>
  </div>

  <div class="shade" id="sh-notes">
    <div class="sheet" role="dialog" aria-labelledby="h-notes">
      <h2 id="h-notes">Notizen</h2>
      <div id="note-list" style="display:flex;flex-direction:column;gap:8px"></div>
      <button class="ghost" id="notes-close" style="flex:none">Schließen</button>
    </div>
  </div>

  <div class="shade" id="sh-code">
    <div class="sheet" role="dialog" aria-labelledby="h-code">
      <h2 id="h-code">Live-Abgleich</h2>
      <p id="code-state"></p>
      <div id="code-row" style="display:flex;flex-direction:column;gap:8px">
        <div class="feld-eingabe" id="code-wrap">
          <input class="tf" id="code-in" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="60" aria-label="Zugangscode">
          <button class="augen-knopf" id="code-augen" type="button" aria-pressed="false" aria-label="Code anzeigen" title="Code anzeigen"><svg class="auge-auf" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg><svg class="auge-zu" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 1 12 1 12a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg></button>
        </div>
        <div class="err" id="code-err" aria-live="polite"></div>
        <button class="ghost" id="code-link" type="button" style="flex:none">Link für Kollegen kopieren</button>
      </div>
      <div class="acts">
        <a class="ghost" id="code-home" href="./">Zur Startseite</a>
        <button class="ghost" id="code-cancel" type="button">Schließen</button>
        <button class="primary" id="code-go" type="button">Anmelden</button>
      </div>
    </div>
  </div>

  <div class="shade" id="sh-reset">

<script>
(function(){

var NAMEN={};
function person(p){

/* ---------- Bahnen und Streifen ---------- */
var lanes=[],hallEl=$("hallp"),gcount={};

function inHall(p){try{var pt=svg.createSVGPoint();pt.x=p.x;pt.y=p.y;return hallEl.isPointInFill(pt)}catch(e){return p.x>=6&&p.x<=697&&p.y>=6&&p.y<=315}}

function inPoly(p,q){var c=false;for(var i=0,j=q.length-1;i<q.length;j=i++){var a=q[i],b=q[j];if((a[1]>p.y)!==(b[1]>p.y)&&p.x<(b[0]-a[0])*(p.y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
var BLOCK=[[159, 288.5, 192, 14.5], [364, 288.5, 199, 14.5], [12, 160, 87, 76], [117, 66, 35, 40], [563, 196, 43, 22]];

function addLane(d,closed,w,grp,reg,label,clip){

      for(var o=-1;o<=1;o++){if(region({x:c.x-l.uy*o*w*0.45,y:c.y+l.ux*o*w*0.45})===reg){ok=true;break}}}

}
function rows(n,y0,y1,xa,xb,grp,reg,label,clip){var h=(y1-y0)/n;for(var k=0;k<n;k++){var y=(y0+h*(k+0.5)).toFixed(2);addLane("M"+xa+" "+y+" H"+xb,false,h,grp,reg,typeof label==="function"?label(k):label,clip)}}
function cols(n,x0,x1,ya,yb,grp,reg,label,clip){var w=(x1-x0)/n;for(var k=0;k<n;k++){var x=(x0+w*(k+0.5)).toFixed(2);addLane("M"+x+" "+ya+" V"+yb,false,w,grp,reg,typeof label==="function"?label(k):label,clip)}}
rows(6,18,57,31,731,"gerade","gerade",function(k){return"Sprintgerade, Bahn "+(k+1)},null);
rows(1,57,60,268,552,"gerade","out","Streifen zwischen Sprintgerade und Rundbahn","outc");
[110.25,104.75,99.25,93.75,88.25,82.75].forEach(function(r,i){
  addLane("M268 "+(173-r)+" H552 A"+r+" "+r+" 0 0 1 552 "+(173+r)+" H268 A"+r+" "+r+" 0 0 1 268 "+(173-r)+" Z",true,5.5,"rund","track","Rundbahn, Bahn "+(6-i),null);
});
rows(6,93,137,188,632,"innen-a","inf","Innenfeld, Seite zur Sprintgeraden","inf");
rows(8,137,190,188,632,"innen-b","inf",function(k){return"Innenfeld, Sprintbahn "+(k+1)},"inf");
rows(9,190,253,188,632,"innen-c","inf","Innenfeld, Seite zur Tribüne","inf");
cols(4,119,150,60,314,"anlauf","anlauf",function(k){return"Anlaufbahn am Kopfende, Bahn "+(k+1)},null);
cols(16,4,119,57,316,"kopf-aussen","out","Kopfende, Wurfbereich","outc");
cols(17,150,268,57,316,"kopf-innen","out","Fläche zwischen Anlaufbahn und Rundbahn","outc");
cols(22,552,704,57,316,"ende","out","Fläche hinter der Rundbahn","outc");
rows(2,303,315,158,563,"tunnel","tunnel","Lauftunnel",null);
cols(2,351,364,286,303,"gang","gang","Gang vom Lauftunnel in die Halle",null);
rows(1,286,288.5,159,563,"spalt","out","Spalt zwischen Rundbahn und Lager","outc");
cols(10,597,661,200,296,"zaun","zaun","Eingezäunter Bereich","zaunc");
/* Flächen, die bisher keine Bahnen hatten. Eigene Gruppennamen, damit alle
   bisher eingetragenen Bahnen ihre Kennung behalten und nichts verrutscht. */
rows(2,6,18,35,675,"tribuene","out","Streifen an der Tribüne","outc");
cols(3,14,31,18,57,"rand-links","out","Rand links neben der Sprintgerade","outc");
cols(5,704,737,16,64,"ecke-rechts","out","Ecke oben rechts","outc");
rows(1,57,60,119,150,"anlauf-kopf","anlauf","Streifen über der Anlaufbahn",null);
function near(l,p){var b=null,bd=1e9;for(var i=0;i<l.pts.length;i++){var q=l.pts[i],d=(q.x-p.x)*(q.x-p.x)+(q.y-p.y)*(q.y-p.y);if(d<bd){bd=d;b=q}}return{s:b.s,dist:Math.sqrt(bd)}}
function key(v){return v?v.p+"|"+v.d:""}
function seg(l,a,len,v){
  var el=document.createElementNS(NS,"path");el.setAttribute("d",l.d);
  if(v)el.setAttribute("stroke",person(v.p).c);else el.setAttribute("class","nichtgereinigt");
  el.setAttribute("stroke-width",l.w);
  if(len<l.L-0.01){el.setAttribute("stroke-dasharray",len.toFixed(2)+" "+(l.L-len+0.01).toFixed(2));el.setAttribute("stroke-dashoffset",(-a).toFixed(2))}

}
function render(l){
  while(l.g.firstChild)l.g.removeChild(l.g.firstChild);

  if(l.closed){var f=-1;for(var i=0;i<n;i++){if(key(l.st[i])!==key(l.st[(i+n-1)%n])){f=i;break}}
    if(f<0){if(l.st[0]){if(!ZEIGE_OFFEN)seg(l,0,l.L,l.st[0])}else if(ZEIGE_OFFEN)seg(l,0,l.L,null);return}start=f}
  var k=0;
  while(k<n){var idx=(start+k)%n,v=l.st[idx],c=1;
    while(k+c<n&&key(l.st[(start+k+c)%n])===key(v))c++;

}
/* Fremde Farben bleiben stehen, außer mit dem Recht "Fremde Farben übermalen".
   Eigene heißt: von der Person, für die gerade eingetragen wird. */
var FREMD_GESCHUETZT=0;
function darfZelle(alt){return !alt||DARF_UEBERMALEN||String(alt.p)===String(S.who)}
function darfStrich(s){return !!s&&(DARF_UEBERMALEN||String(s.p)===String(S.who))}
function fill(l,a,b,v,undo){
  var i0=Math.floor(Math.min(a,b)/l.ps),i1=Math.min(Math.floor(Math.max(a,b)/l.ps),i0+l.n-1);
  for(var i=i0;i<=i1;i++){var x=l.closed?((i%l.n)+l.n)%l.n:i;if(x<0||x>=l.n||(l.valid&&!l.valid[x]))continue;
    if(key(l.st[x])===key(v))continue;
    if(!darfZelle(l.st[x])){FREMD_GESCHUETZT++;continue}
    if(undo&&!(x in undo))undo[x]=l.st[x];
    l.st[x]=v;mark(l,x,v)}
}
function progress(){
  var tot=0,done=0;
  lanes.forEach(function(l){var a=l.ps*l.w;for(var i=0;i<l.n;i++){if(l.valid&&!l.valid[i])continue;tot+=a;if(l.st[i])done+=a}});
  var anteil=tot?Math.round(done/tot*100):0;
  $("prog").textContent=ZEIGE_OFFEN?(anteil+" % geputzt \u00b7 "+(100-anteil)+" % offen"):(anteil+" % geputzt");
}

/* ---------- Speichern (nur dieses Gerät) ---------- */
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({brush:S.brush,view:S.view,art:S.art,dir:S.dir,free:free,notes:notes,
    lanes:lanes.map(function(l){return l.st.map(function(v){return v?[v.p,v.d]:0})})}))}catch(e){}
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);if(!raw)return false;
    var o=JSON.parse(raw);if(!o||!Array.isArray(o.lanes)||o.lanes.length!==lanes.length)return false;
    for(var i=0;i<lanes.length;i++){if(!Array.isArray(o.lanes[i])||o.lanes[i].length!==lanes[i].n)return false}
    lanes.forEach(function(l,i){l.st=o.lanes[i].map(function(v){return v?{p:v[0],d:v[1]}:null})});
    notes=Array.isArray(o.notes)?o.notes:[];
    notes.forEach(function(n,i){if(!n.id)n.id="alt"+i;if(!n.ts)n.ts=i});

    if(o.brush==="one"||o.brush==="all"||o.brush==="mid")S.brush=o.brush;
    if(o.view==="plan"||o.view==="color")S.view=o.view;
    if(o.art==="lanes"||o.art==="free")S.art=o.art;
    if(o.dir==="down"||o.dir==="right")S.dir=o.dir;
    free=Array.isArray(o.free)?o.free:[];
    return true;
  }catch(e){return false}
}
/* ---------- Live-Abgleich mit den anderen Handys (Firebase Realtime Database) ---------- */
/* Zugang und Datenbank kommen aus js/zugang.js. Das Gerät wird einmal mit dem Zugangscode freigeschaltet, für alle Bereiche.
   Die Datenbank prüft bei jedem Lesen und Schreiben, ob das Gerät freigeschaltet ist. */
var ZUGANG="./js/zugang.js";
var sync={on:false,db:null,fn:null,Z:null,base:"putzplan",outbox:[],pending:{},timer:0,conn:false,gotL:false,gotN:false,state:"none",saveT:0};
var STATE_TXT={none:"Nur dieses Gerät",nocode:"Code fehlt",connecting:"Verbinde …",live:"Live",offline:"Offline",denied:"Code ungültig",fail:"Keine Verbindung"};
var STATE_LONG={
  none:"Der Live-Abgleich ist hier noch nicht eingerichtet. Was du einträgst, bleibt nur auf diesem Handy.",
  nocode:"Gib den Zugangscode ein, damit alle Hausmeister denselben Plan sehen.",
  connecting:"Verbindung wird aufgebaut …",
  live:"Verbunden. Was jemand einträgt, erscheint sofort bei allen anderen.",
  offline:"Gerade kein Netz. Neue Einträge werden gesendet, sobald die Verbindung wieder steht. Solange bleibt der letzte Stand sichtbar.",
  denied:"Der Zugang ist nicht mehr gültig. Bitte den Code neu eingeben.",
  fail:"Die Verbindung konnte nicht aufgebaut werden. Prüf das WLAN und lade die Seite neu."};
function setState(s){sync.state=s;$("live").className="live s-"+s;$("live-t").textContent=STATE_TXT[s]}
function enc(v){return v.p+"|"+v.d}
/* Vor dem Strich steht, wer gewischt hat. Neu ist das die Benutzerkennung, früher
   war es eine Nummer aus ALT_PEOPLE. Eine reine Zahl bleibt darum eine Zahl,
   alles andere bleibt Text; person() unterscheidet danach. */
function pid(v){var s=String(v==null?"":v);return /^[0-9]+$/.test(s)?+s:s}
function dec(t){if(typeof t!=="string")return null;var i=t.indexOf("|");if(i<1)return null;return{p:pid(t.slice(0,i)),d:t.slice(i+1)}}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function noteById(id){for(var i=0;i<notes.length;i++){if(notes[i].id===id)return notes[i]}return null}
function noteIdx(id){for(var i=0;i<notes.length;i++){if(notes[i].id===id)return i}return -1}
function lazySave(){clearTimeout(sync.saveT);sync.saveT=setTimeout(save,800)}
function onErr(e){
  var m=String(e&&(e.code||e.message)||"");
  if(/permission/i.test(m)&&sync.state!=="denied"&&sync.state!=="nocode"){setState("denied");openCode("Der Zugang ist nicht mehr gültig. Bitte den Code neu eingeben.")}
}
function put(o){
  if(!sync.on||NUR_ANSEHEN)return;
  if(!sync.db){sync.outbox.push(o);return}
  sync.fn.update(sync.fn.ref(sync.db,sync.base),o).catch(onErr);
}
function mark(l,x,v){
  if(!sync.on||NUR_ANSEHEN)return;
  (sync.pending[l.id]=sync.pending[l.id]||{})[x]=v;
  if(!sync.timer)sync.timer=setTimeout(flush,120);
}
function flush(){
  if(sync.timer){clearTimeout(sync.timer);sync.timer=0}
  if(!sync.on||!sync.db)return;
  var up={},n=0,lid,i,m;
  for(lid in sync.pending){m=sync.pending[lid];for(i in m){up["lanes/"+lid+"/"+i]=m[i]?enc(m[i]):null;n++}}
  sync.pending={};
  if(n)put(up);
}
function putNote(n){var o={};o["notes/"+n.id]={ts:n.ts,x:n.x,y:n.y,t:n.t,by:n.by,d:n.d};put(o)}
function putNoteDel(id){var o={};o["notes/"+id]=null;put(o)}
function commitMove(){
  if(!nd||!nd.moved)return;
  var n=noteById(nd.id);if(!n)return;
  pushOp({k:"note-move",id:n.id,a:{x:nd.x0,y:nd.y0},b:{x:n.x,y:n.y}});
  var o={};o["notes/"+n.id+"/x"]=n.x;o["notes/"+n.id+"/y"]=n.y;put(o);save();
}
function sameSt(a,b){for(var i=0;i<a.length;i++){if(key(a[i])!==key(b[i]))return false}return true}
function applyLanes(snap){
  var byId={};
  snap.forEach(function(c){byId[c.key]=c});
  lanes.forEach(function(l){
    var arr=new Array(l.n).fill(null),c=byId[l.id],pd=sync.pending[l.id],k;
    if(c){c.forEach(function(sg){var i=+sg.key;if(i>=0&&i<l.n&&(!l.valid||l.valid[i])){var v=dec(sg.val());if(v)arr[i]=v}})}
    if(pd){for(k in pd){arr[+k]=pd[k]}}
    if(!sameSt(arr,l.st)){l.st=arr;render(l)}
  });
  progress();lazySave();
}
function applyNotes(snap){
  var arr=[];
  snap.forEach(function(c){
    var o=c.val();
    if(o&&typeof o.x==="number"&&typeof o.y==="number"&&typeof o.t==="string"){arr.push({id:c.key,ts:+o.ts||0,x:o.x,y:o.y,t:o.t,by:String(o.by||"?"),d:String(o.d||"")})}
  });
  arr.sort(function(a,b){return a.ts-b.ts||(a.id<b.id?-1:a.id>b.id?1:0)});
  if(nd&&nd.moved){arr.forEach(function(n){if(n.id===nd.id){n.x=nd.x;n.y=nd.y}})}

  if($("sh-notes").classList.contains("open"))openNotes(-1);

function checkLive(){
  if(!sync.on||sync.state==="denied"||sync.state==="fail")return;
  setState(sync.gotL&&sync.gotN?(sync.conn?"live":"offline"):"connecting");
}
/* Beim Öffnen wird zuerst geprüft, ob dieses Gerät schon freigeschaltet ist. Wenn nicht, kommt die Anmeldung. */
function startSync(){
  sync.on=true;setState("connecting");
  import(ZUGANG).then(function(Z){
    sync.Z=Z;
    return Z.sitzung().then(function(ich){
      if(!ich||!Z.darf(ich,"reinigung")){
        sync.on=false;sync.outbox=[];sync.pending={};setState("nocode");
        openCode(ich?"Dieser Zugang darf die Hallenreinigung nicht sehen.":"");
        return;
      }
      S.who=ich.bid||"admin";
      NAMEN[S.who]={name:ich.name,farbe:ich.farbe};
      import("./js/leiste.js").then(function(L){L.leisteStarten(ich,"reinigung")}).catch(function(e){try{console.error(e)}catch(x){}});
      DARF_VERTRETEN=Z.darfVertreten(ich,"reinigung");DARF_UEBERMALEN=Z.darfZusatz(ich,"reinigung","uebermalen");
      $("who-car").hidden=!DARF_VERTRETEN;
      $("who-btn").setAttribute("aria-haspopup",String(DARF_VERTRETEN));
      syncButtons();peopleZeichnen();
      Z.namen().then(function(n){Object.keys(n||{}).forEach(function(k){NAMEN[k]=n[k]});NAMEN[S.who]={name:ich.name,farbe:ich.farbe};syncButtons();peopleZeichnen();lanes.forEach(render);});
      var db=Z.db,base=sync.base;
      sync.fn=Z;sync.db=db;
      Z.onValue(Z.ref(db,".info/connected"),function(s){sync.conn=s.val()===true;checkLive()});
      Z.onValue(Z.ref(db,base+"/lanes"),function(s){applyLanes(s);sync.gotL=true;checkLive()},onErr);
      Z.onValue(Z.ref(db,base+"/notes"),function(s){applyNotes(s);sync.gotN=true;checkLive()},onErr);
      Z.onValue(Z.ref(db,base+"/free"),function(s){applyFree(s)},onErr);
      sync.outbox.splice(0).forEach(put);
      flush();
    });
  }).catch(function(e){try{console.error(e)}catch(x){}if(sync.state!=="denied")setState("fail")});
}
/* Augen-Taste: der Code lässt sich zum Nachsehen kurz sichtbar machen. Beim Öffnen wird er wieder verdeckt. */
function codeSichtbar(sichtbar){
  var knopf=$("code-augen"),feld=$("code-in");
  feld.type=sichtbar?"text":"password";
  knopf.setAttribute("aria-pressed",String(sichtbar));
  var t=sichtbar?"Code verbergen":"Code anzeigen";
  knopf.setAttribute("aria-label",t);knopf.title=t;
}
$("code-augen").addEventListener("click",function(){codeSichtbar($("code-in").type==="password");$("code-in").focus()});
function openCode(msg){
  var gate=sync.state==="nocode"||sync.state==="denied";
  $("code-in").value="";codeSichtbar(false);$("code-err").textContent=msg||"";
  $("h-code").textContent=gate?"Anmelden":"Live-Abgleich";
  $("code-state").textContent=gate?"Bitte den Zugangscode eingeben. Das Gerät merkt sich den Zugang. Der Code muss hier nur einmal eingegeben werden.":(STATE_LONG[sync.state]||"");
  $("code-wrap").style.display=gate?"":"none";
  $("code-go").style.display=gate?"":"none";
  $("code-home").style.display=gate?"":"none";
  $("code-cancel").style.display=gate?"none":"";
  $("code-link").style.display=gate?"none":"";
  $("sh-code").classList.toggle("gate",gate);
  show("sh-code",true);
  if(gate)setTimeout(function(){try{$("code-in").focus()}catch(e){}},50);
}
$("live").addEventListener("click",function(){openCode("")});
$("code-cancel").addEventListener("click",function(){show("sh-code",false)});
function codeGo(){
  var c=String($("code-in").value||"").trim(),btn=$("code-go");
  if(!c){$("code-err").textContent="Bitte den Zugangscode eingeben.";return}

    nd=null;
  }
  gesture=null;
}
svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);

/* ---------- Notizen ---------- */
function drawPins(){
  while(pinG.firstChild)pinG.removeChild(pinG.firstChild);
  notes.forEach(function(n,i){
    var c=document.createElementNS(NS,"circle");c.setAttribute("cx",n.x);c.setAttribute("cy",n.y);c.setAttribute("r",8);
    c.setAttribute("fill","#F29F05");c.setAttribute("stroke","#2B1B00");c.setAttribute("stroke-width","1");pinG.appendChild(c);
    var t=document.createElementNS(NS,"text");t.setAttribute("x",n.x);t.setAttribute("y",n.y+3.4);t.setAttribute("text-anchor","middle");
    t.setAttribute("font-size","9.5");t.setAttribute("font-weight","600");t.setAttribute("fill","#2B1B00");t.setAttribute("font-family","Barlow, sans-serif");
    if(portrait)t.setAttribute("transform","rotate(-90 "+n.x+" "+n.y+")");
    t.textContent=String(i+1);pinG.appendChild(t);
  });
  $("open-notes").textContent="Notizen ("+notes.length+")";
  $("mehr-zahl").textContent=String(notes.length);$("mehr-zahl").hidden=!notes.length;
}
function show(id,on){$(id).classList.toggle("open",on)}
var pend=null;
function openEdit(p){

$("edit-save").addEventListener("click",function(){

  var nw={id:newId(),ts:Date.now(),x:pend.x,y:pend.y,t:t,by:person(S.who).n,d:dstr(0)};
  notes.push(nw);pend=null;putNote(nw);pushOp({k:"note-add",n:JSON.parse(JSON.stringify(nw))});
  show("sh-edit",false);drawPins();save();say("Notiz "+notes.length+" gespeichert.",true);

function openNotes(hot){
  var box=$("note-list");while(box.firstChild)box.removeChild(box.firstChild);
  if(!notes.length){var p=document.createElement("p");p.textContent="Wähl oben Notiz und tipp auf eine Stelle im Plan, um die erste Notiz zu setzen.";box.appendChild(p)}
  notes.forEach(function(n,i){
    var row=document.createElement("div");row.className="note"+(i===hot?" hot":"");
    var num=document.createElement("span");num.className="num";num.textContent=String(i+1);
    var tx=document.createElement("span");tx.className="tx";tx.textContent=n.t;
    var meta=document.createElement("span");meta.className="meta";meta.textContent=n.by+", "+n.d;tx.appendChild(meta);
    var del=document.createElement("button");del.textContent="Löschen";del.setAttribute("aria-label","Notiz "+(i+1)+" löschen");
    del.addEventListener("click",function(){var gone=notes.splice(i,1)[0];drawPins();save();if(gone){putNoteDel(gone.id);pushOp({k:"note-del",n:JSON.parse(JSON.stringify(gone))})}openNotes(-1)});
    tx.style.cursor="pointer";tx.setAttribute("role","button");tx.tabIndex=0;
    tx.addEventListener("click",function(){show("sh-notes",false);openNote(i)});
    tx.addEventListener("keydown",function(ev){if(ev.key==="Enter"){show("sh-notes",false);openNote(i)}});
    row.appendChild(num);row.appendChild(tx);row.appendChild(del);box.appendChild(row);
    if(i===hot)setTimeout(function(){try{row.scrollIntoView({block:"nearest"})}catch(e){}},30);
  });
  show("sh-notes",true);
}

/* ---------- Zurücksetzen ---------- */
var armed=false;
function disarm(){armed=false;$("reset-go").textContent="Zurücksetzen";$("reset-warn").textContent=""}
$("open-reset").addEventListener("click",function(){
  disarm();
  $("h-reset").textContent=DARF_UEBERMALEN?"Alle Flächen auf offen setzen?":"Deine Flächen auf offen setzen?";
  $("reset-text").textContent=DARF_UEBERMALEN
    ?"Alle eingemalten Flächen verschwinden, bei allen Personen. Das lässt sich nicht rückgängig machen. Die Notizen bleiben erhalten."
    :"Deine eingemalten Flächen und Striche verschwinden. Flächen anderer bleiben stehen, dafür fehlt dir das Recht zum Übermalen. Die Notizen bleiben erhalten.";
  show("sh-reset",true);
});
$("reset-cancel").addEventListener("click",function(){disarm();show("sh-reset",false)});
$("reset-go").addEventListener("click",function(){
  if(!armed){armed=true;$("reset-go").textContent="Wirklich zurücksetzen";$("reset-warn").textContent="Zur Sicherheit: Drück den roten Knopf ein zweites Mal.";return}
  if(sync.on&&!sync.db){armed=false;$("reset-go").textContent="Zurücksetzen";$("reset-warn").textContent="Noch keine Verbindung. Zurücksetzen geht erst, wenn oben „Live“ steht.";return}
  disarm();
  var nurEigene=!DARF_UEBERMALEN;
  if(!nurEigene)sync.pending={};
  var rops=[];lanes.forEach(function(l){var it=[];for(var q=0;q<l.n;q++){if(l.st[q]&&darfZelle(l.st[q]))it.push({l:l.id,i:q,a:l.st[q],b:null})}if(it.length)rops.push({k:"lanes",items:it})});
  var weg=free.filter(darfStrich);
  if(weg.length)rops.push({k:"free-del",items:weg.slice()});
  if(rops.length)pushOp({k:"batch",ops:rops});
  if(nurEigene){
    /* Jede eigene Fläche und jeder eigene Strich einzeln; fremde bleiben stehen. */
    rops.forEach(function(op){if(op.k==="lanes")op.items.forEach(function(it){setCell(it.l,it.i,null)})});
    weg.forEach(function(s){freeDel(s)});
    renderFree();
  }else{
    free=[];renderFree();
    lanes.forEach(function(l){l.st.fill(null);render(l)});
    if(sync.on)sync.fn.set(sync.fn.ref(sync.db,sync.base+"/lanes"),null).catch(onErr);
    if(sync.on)put({"free":null});
  }
  progress();save();show("sh-reset",false);
  say(nurEigene?"Deine Flächen stehen wieder auf offen. Flächen anderer und die Notizen sind noch da.":"Alle Flächen stehen wieder auf offen. Die Notizen sind noch da.",false);
});

/* ---------- Plan als Bild herunterladen ---------- */
/* Der Plan im SVG lebt von den Farben der Seite. Fuer das Bild werden sie
   fest eingetragen, sonst kaeme ein schwarz-weisser Umriss heraus. */
function bildStil(farbig,v){
  var ink=v("--ink","#14201B"),ink2=v("--ink-2","#55635C"),panel=v("--panel","#F7F9F7");
  var line=v("--line","#C3CCC6"),bahn=v("--plan-track","#DCE3DE"),grau=v("--ungewischt","#A8B2AC");
  var strich=farbig?"#10201A":ink;
  return ".hall{fill:"+(farbig?"#4E9977":panel)+"}"
    +".floor{fill:"+(farbig?"#57A683":"none")+"}"
    +".track{fill:"+(farbig?"#B4513E":bahn)+"}"
    +".sand{fill:"+(farbig?"#DCC48E":"none")+"}"
    +".mat{fill:"+(farbig?"#E7B21C":"none")+"}"
    +".trib{fill:"+(farbig?"#8C9590":line)+"}"
    +".ln{fill:none;stroke:"+(farbig?"#FFFFFF":ink2)+";stroke-width:.9"+(farbig?";stroke-opacity:.9":"")+"}"
    +".ln.thin{stroke-width:.45}.ln.dash{stroke-dasharray:3 2}"
    +".hallwall{fill:none;stroke:"+strich+";stroke-width:2.4;stroke-linejoin:round}"
    +".wall{fill:none;stroke:"+strich+";stroke-width:1.6;stroke-linejoin:round}"
    +".fence{fill:none;stroke:"+strich+";stroke-width:2;stroke-dasharray:5 2.2;stroke-linejoin:round}"
    +".zgate{fill:none;stroke:"+strich+";stroke-width:1.2}"
    +".wpan{fill:"+(farbig?"#FFFFFF":ink)+";stroke:"+strich+";stroke-width:.6;stroke-linejoin:round}"
    +".pil{fill:"+(farbig?"#DAD7CC":panel)+";stroke:"+strich+";stroke-width:1.1}"
    +".gate{display:"+(farbig?"inline":"none")+";fill:#FFFFFF;stroke:#10201A;stroke-width:.5;stroke-linejoin:round}"
    +".tag{font-family:sans-serif;font-size:8.5px;fill:"+(farbig?"#FFFFFF":ink2)+";text-anchor:middle}"
    +"#paint path,#free path{stroke-opacity:"+(farbig?".9":".82")+"}"
    +"#paint path.nichtgereinigt,#free path.nichtgereinigt{stroke:"+(farbig?"#D7DCD8":grau)+";stroke-opacity:"+(farbig?"1":".95")+"}"
    +"#pins circle{fill:"+(farbig?"#F29F05":panel)+";stroke:"+(farbig?"#2B1B00":ink)+"}"
    +"#pins text{font-family:sans-serif;fill:"+(farbig?"#2B1B00":ink)+"}"
    +(ZEIGE_OFFEN?"#free{display:none}":"");
}
function planBild(){
  var knopf=$("btn-bild");
  if(knopf.disabled)return;
  knopf.disabled=true;
  say("Das Bild wird erstellt …",false);
  var fertig=function(){knopf.disabled=false};
  try{
    var cs=getComputedStyle(document.documentElement);
    var v=function(n,e){return (cs.getPropertyValue(n)||"").trim()||e};
    var farbig=map.classList.contains("color");
    var klon=svg.cloneNode(true);
    klon.setAttribute("xmlns",NS);
    klon.setAttribute("viewBox","0 0 "+W0+" "+H0);
    klon.setAttribute("width",W0);
    klon.setAttribute("height",H0);
    var welt=klon.querySelector("#world");
    if(welt)welt.removeAttribute("transform");   /* immer quer, egal wie der Plan gerade steht */
    var stil=document.createElementNS(NS,"style");
    stil.textContent=bildStil(farbig,v);
    klon.insertBefore(stil,klon.firstChild);
    var quelle='<?xml version="1.0" encoding="UTF-8"?>'+new XMLSerializer().serializeToString(klon);
    var bild=new Image();
    bild.onload=function(){
      try{
        var m=3;   /* dreifache Groesse, damit es auf dem Handy scharf bleibt */
        var lw=document.createElement("canvas");
        lw.width=W0*m;lw.height=H0*m;
        var c=lw.getContext("2d");
        c.fillStyle=farbig?"#2C3A33":v("--panel","#F7F9F7");
        c.fillRect(0,0,lw.width,lw.height);
        c.drawImage(bild,0,0,lw.width,lw.height);
        lw.toBlob(function(b){
          if(!b){say("Das Bild konnte nicht erstellt werden.",true);fertig();return}
          var t=new Date();
          var zwei=function(n){return (n<10?"0":"")+n};
          var name="Reinigungsplan-"+t.getFullYear()+"-"+zwei(t.getMonth()+1)+"-"+zwei(t.getDate())+".png";
          var url=URL.createObjectURL(b);
          var a=document.createElement("a");
          a.href=url;a.download=name;
          document.body.appendChild(a);a.click();a.remove();
          setTimeout(function(){URL.revokeObjectURL(url)},20000);
          say("Bild gespeichert: "+name,true);
          fertig();
        },"image/png");
      }catch(e){try{console.error(e)}catch(x){}say("Das Bild konnte nicht erstellt werden.",true);fertig()}
    };
    bild.onerror=function(){say("Das Bild konnte nicht erstellt werden.",true);fertig()};
    bild.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(quelle);
  }catch(e){try{console.error(e)}catch(x){}say("Das Bild konnte nicht erstellt werden.",true);fertig()}
}
$("btn-bild").addEventListener("click",planBild);
