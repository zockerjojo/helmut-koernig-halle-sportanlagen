<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Seite nicht gefunden · Helmut-Körnig-Halle</title>
<link rel="icon" type="image/png" href="/bilder/favicon.png">
<link rel="apple-touch-icon" href="/bilder/symbol.png">
<script>
/* Andere Schreibweisen der Adressen führen zur richtigen Seite, zum Beispiel /reinigungsplan statt /Reinigungsplan */
(function () {
  var ZIELE = {
    reinigungsplan: "Reinigungsplan", reinungsplan: "Reinigungsplan", reinigung: "Reinigungsplan",
    hallenreinigung: "Reinigungsplan", putzplan: "Reinigungsplan",
    sportanlagen: "Sportanlagen", personal: "Sportanlagen", matten: "Sportanlagen", admin: "Sportanlagen",
    arbeitsplan: "Arbeitsplan", hallenarbeitsplan: "Arbeitsplan", aufgaben: "Arbeitsplan"
  };
  try {
    var teile = location.pathname.split("/");
    var letzter = teile.pop() || teile.pop() || "";
    var wort = decodeURIComponent(letzter).toLowerCase().replace(/\.html?$/, "");
    var ziel = Object.prototype.hasOwnProperty.call(ZIELE, wort) ? ZIELE[wort] : null;
    if (ziel && letzter !== ziel) location.replace(teile.join("/") + "/" + ziel + location.search + location.hash);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDEA; --panel:#F7F9F7; --ink:#14201B; --ink2:#55635C; --line:#C3CCC6;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F1512; --panel:#18211C; --ink:#E7EEE9; --ink2:#9BAAA1; --line:#33413A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.35}
.seite{max-width:640px; margin:0 auto; padding:18px 16px 14px; display:flex; flex-direction:column; gap:14px}
.marke{margin:0; font-size:13px; font-weight:500; letter-spacing:.04em; text-transform:uppercase; color:var(--ink2)}
h1{margin:0; font-family:var(--display); font-weight:600; font-size:clamp(32px, 8vw, 44px); line-height:1; text-transform:uppercase; text-wrap:balance}
p{margin:0}
.knopf{display:inline-flex; align-items:center; justify-content:center; align-self:flex-start; min-height:44px; padding:8px 18px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:15px; font-weight:600; text-decoration:none}
.knopf:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.logo-link{display:inline-flex; align-items:center; gap:10px; align-self:flex-start; text-decoration:none; color:inherit; border-radius:6px}
.logo-link img{flex:none; display:block; height:34px; width:auto}
.logo-link:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
</style>
</head>
<body>
<div class="seite">
  <a class="logo-link" href="/" aria-label="Zur Startseite">
    <img src="/bilder/logo.png" alt="Dortmunder Sportstätten" width="480" height="241">
    <span class="marke">Helmut-Körnig-Halle</span>
  </a>
  <h1>Seite nicht gefunden</h1>
  <p>Diese Adresse gibt es hier nicht.</p>
  <a class="knopf" id="start" href="/">Zur Startseite</a>
</div>
<script>
(function () {
  /* Farbschema wie auf den anderen Seiten */
  var gemerkt = null;
  try { gemerkt = localStorage.getItem("hkh-thema"); } catch (e) {}
  var dunkel = gemerkt ? gemerkt === "dark" : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dunkel ? "dark" : "light");
  /* Solange die Seite unter github.io liegt, beginnt sie mit dem Namen des Projekts */
  if (/\.github\.io$/i.test(location.hostname)) {
    document.getElementById("start").href = "/" + (location.pathname.split("/")[1] || "") + "/";
  }
})();
</script>
</body>
</html>
